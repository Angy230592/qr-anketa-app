{% extends "base.html" %}
{% block title %}Вход по телефону{% endblock %}
{% block content %}
<section class="card login">
  <p class="eyebrow">Анкета</p>
  <h1>Вход по номеру телефона</h1>
  <p class="lead">На номер придёт код подтверждения.</p>
  <form method="post" action="{{ url_for('phone_login_post') }}" class="form phone-form">
    <label>Номер телефона
      <span class="phone-row">
        <span class="phone-prefix">+7</span>
        <input class="text-input" type="tel" name="phone_local" inputmode="numeric" autocomplete="tel-national" placeholder="900 000-00-00" value="{{ phone_local or '' }}" maxlength="10" pattern="[0-9]{10}" required aria-label="Номер без плюс 7" oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">
      </span>
    </label>
    <button class="btn primary wide" type="submit">Получить код</button>
  </form>
</section>
{% endblock %}
